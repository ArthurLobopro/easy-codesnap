name: Publish Extension

on:
  push:
    branches: [ main ]
    paths:
      - 'package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install vsce
        run: npm i -g @vscode/vsce

      - name: Compress JSON Files
        run: bun run compress-json
        
      - name: Publish Extension on VSCODE
        run: vsce publish -p ${{secrets.PUBLISH_TOKEN}} --skip-duplicate
      
      - name: Install Open VSX
        run: npm install --global ovsx

      - name: Get Version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Build Again
        run: vsce package

      - name: Publish on Open VSX
        run: |
          ls *.vsix
          ovsx publish "easy-codesnap-$VERSION.vsix" --trusted-publishing
        env:
          VERSION: ${{ env.version }}
